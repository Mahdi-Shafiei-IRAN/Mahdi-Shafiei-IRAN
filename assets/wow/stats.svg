<svg xmlns="http://www.w3.org/2000/svg" width="840" height="104" viewBox="0 0 840 104" role="img" aria-label="Profile statistics"><title>Profile statistics</title><style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop 1.1s cubic-bezier(.2,.8,.2,1.2) .2s forwards}@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}.float{animation:float 6s ease-in-out 1.4s infinite}@keyframes float{50%{transform:translateY(-5px)}}.fade{opacity:0;animation:fade .9s ease-out forwards}@keyframes fade{to{opacity:1}}.ln{opacity:0;animation:fade .2s linear forwards}.shine{animation:shine 4.5s ease-in-out 1.6s infinite}@keyframes shine{from{transform:translateX(0)}55%,to{transform:translateX(560px)}}.scan{animation:scan 3.6s linear infinite}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(352px)}}</style><g class="fade" style="animation-delay:0.00s"><rect x="1" y="1" width="193" height="102" rx="14" fill="#0c0b16" stroke="#2a2440"/><rect x="18" y="1" width="159" height="3" rx="1.5" fill="#f0abfc"/><text x="97.5" y="56" text-anchor="middle" font-size="30" font-weight="900" fill="#f0abfc">807</text><text x="97.5" y="82" text-anchor="middle" font-size="12" letter-spacing="2" fill="#9d97c0">CONTRIBUTIONS</text></g><g class="fade" style="animation-delay:0.15s"><rect x="216" y="1" width="193" height="102" rx="14" fill="#0c0b16" stroke="#2a2440"/><rect x="233" y="1" width="159" height="3" rx="1.5" fill="#a78bfa"/><text x="312.5" y="56" text-anchor="middle" font-size="30" font-weight="900" fill="#a78bfa">19</text><text x="312.5" y="82" text-anchor="middle" font-size="12" letter-spacing="2" fill="#9d97c0">STARS</text></g><g class="fade" style="animation-delay:0.30s"><rect x="431" y="1" width="193" height="102" rx="14" fill="#0c0b16" stroke="#2a2440"/><rect x="448" y="1" width="159" height="3" rx="1.5" fill="#67e8f9"/><text x="527.5" y="56" text-anchor="