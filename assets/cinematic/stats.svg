<svg xmlns="http://www.w3.org/2000/svg" width="840" height="120" viewBox="0 0 840 120" role="img" aria-label="Profile statistics"><title>Profile statistics</title><defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5e8a"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.fade{opacity:0;animation:fade 1.2s ease-out forwards}@keyframes fade{to{opacity:1}}.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.pulse{stroke-opacity:0;animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{stroke-opacity:.9}}</style><g transform="translate(0 6)"><g class="rise" style="animation-delay:0.00s"><rect x="1" y="1" width="193" height="106" rx="12" fill="#130e24" stroke="url(#edge)" stroke-width="1.5"/><rect class="pulse" style="animation-delay:0.0s" x="1" y="1" width="193" height="106" rx="12" fill="none" stroke="#f5c76b" stroke-width="1.5"/><text x="97.5" y="58" text-anchor="middle" font-size="32" font-weight="800" fill="#f5f3ff">3</text><text x="97.5" y="86" text-anchor="middle" font-size="11" letter-spacing="3" fill="#a69cc9">FOLLOWERS</text></g></g><g transform="translate(215 6)"><g class="rise" style="animation-delay:0.18s"><rect x="1" y="1" width="193" height="106" rx="12" fill="#130e24" stroke="url(#edge)" stroke-width="1.5"/><rect class="pulse" style="animation-delay:0.6s" x="1" y="1" width="193" height="106" rx="12" fill="none" stroke="#f5c76b" stroke-width="1.5"/><text x="97.5" y="58" text-anchor="middle" font-size="32" font-weight="800" fill="#f5f3ff">12</text><text x="97.5" y="86" text-anchor="middle" font-size="11" letter-spacing="3" fill="#a69cc9">REPOSITORIES</text></g></g><g transform="translate(430 6)"><g class="rise" style="animation-delay:0.36s"><rect x="1" y="1" width="193" height="106" rx="12" fill="#130e24" stroke="url(#edge)" stroke-width="1.5"/><rect class="pulse" style="animation-delay:1.2s" x="1" y="1" width="193" height="106" rx="12" fill="none" stroke="#f5c76b" stroke-width="1.5"/><text x="97.5" y="58" text-anchor="middle" font-size="32" font-weight="800" fill="#f5f3ff">19</text><text x="97.5" y="86" text-anchor="middle" font-size="11" letter-spacing="3" fill="#a69cc9">STARS</text></g></g><g transform="translate(645 6)"><g class="rise" style="animation-delay:0.54s"><rect x="1" y="1" width="193" height="106" rx="12" fill="#130e24" stroke="url(#edge)" stroke-width="1.5"/><rect class="pulse" style="animation-delay:1.8s" x="1" y="1" width="193" height="106" rx="12" fill="none" stroke="#f5c76b" stroke-width="1.5"/><text x="97.5" y="58" text-anchor="middle" font-size="32" font-weight="800" fill="#f5f3ff">815</text><text x="97.5" y="86" text-anchor="middle" font-size="11" letter-spacing="3" fill="#a69cc9">CONTRIBUTIONS</text></g></g></svg>
